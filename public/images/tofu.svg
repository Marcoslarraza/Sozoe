<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#b8956a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- wooden table surface -->
  <ellipse cx="200" cy="240" rx="160" ry="30" fill="url(#table)" opacity="0.3"/>
  <!-- cutting board -->
  <rect x="100" y="140" width="200" height="120" rx="8" fill="#e8d5b7" stroke="#c4a882" stroke-width="1"/>
  <rect x="108" y="148" width="184" height="104" rx="4" fill="#f5e6d0"/>
  <!-- tofu block -->
  <rect x="130" y="160" width="100" height="70" rx="3" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <rect x="132" y="162" width="96" height="66" rx="2" fill="#fffbeb" opacity="0.8"/>
  <!-- tofu slices -->
  <rect x="245" y="170" width="25" height="55" rx="2" fill="#fefce8" stroke="#fde68a" stroke-width="0.5" transform="rotate(5 257 197)"/>
  <rect x="255" y="175" width="25" height="50" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5" transform="rotate(-3 267 200)"/>
  <!-- herbs -->
  <circle cx="155" cy="155" r="4" fill="#22c55e" opacity="0.7"/>
  <circle cx="165" cy="152" r="3" fill="#16a34a" opacity="0.6"/>
  <circle cx="145" cy="153" r="3.5" fill="#4ade80" opacity="0.7"/>
  <!-- label -->
  <text x="200" y="60" text-anchor="middle" font-family="serif" font-size="24" fill="#166534" font-weight="bold">Tofu Orgánico</text>
  <text x="200" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Extra firme · 100% vegetal</text>
</svg>
