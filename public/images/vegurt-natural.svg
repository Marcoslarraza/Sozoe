<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfeff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <!-- table -->
  <ellipse cx="200" cy="260" rx="160" ry="20" fill="#d4a574" opacity="0.15"/>
  <!-- yogurt cup -->
  <path d="M 140 130 L 135 240 Q 135 255 200 255 Q 265 255 265 240 L 260 130 Z" fill="url(#cup)" stroke="#bae6fd" stroke-width="2"/>
  <!-- yogurt content -->
  <ellipse cx="200" cy="140" rx="58" ry="15" fill="#fefce8"/>
  <!-- lid band -->
  <rect x="137" y="118" width="126" height="18" rx="3" fill="#67e8f9" opacity="0.6"/>
  <!-- coconut pieces floating -->
  <circle cx="180" cy="145" r="5" fill="#fefce8" stroke="#fef3c7" stroke-width="0.5"/>
  <circle cx="215" cy="142" r="4" fill="#fffbeb" stroke="#fef3c7" stroke-width="0.5"/>
  <!-- coconut halves decoration -->
  <circle cx="310" cy="200" r="22" fill="#7c2d12" opacity="0.5"/>
  <path d="M 295 200 A 15 15 0 0 1 325 200" fill="#fefce8"/>
  <circle cx="90" cy="180" r="18" fill="#7c2d12" opacity="0.4"/>
  <path d="M 77 180 A 13 13 0 0 1 103 180" fill="#fffbeb"/>
  <!-- spoon -->
  <rect x="260" y="90" width="4" height="100" rx="2" fill="#d1d5db" transform="rotate(15 262 140)"/>
  <ellipse cx="265" cy="90" rx="12" ry="18" fill="#e5e7eb" transform="rotate(15 265 90)"/>
  <!-- label -->
  <text x="200" y="45" text-anchor="middle" font-family="serif" font-size="22" fill="#0e7490" font-weight="bold">Vegurt Natural</text>
  <text x="200" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Yogurt vegetal · Leche de coco</text>
</svg>
