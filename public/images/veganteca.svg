<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8"/>
      <stop offset="100%" style="stop-color:#fef9c3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <!-- table surface -->
  <ellipse cx="200" cy="250" rx="170" ry="25" fill="#d4a574" opacity="0.2"/>
  <!-- toast/bread -->
  <path d="M 120 200 Q 120 160 160 155 Q 200 150 240 155 Q 280 160 280 200 L 270 220 Q 200 225 130 220 Z" fill="#e8b86d" stroke="#d4a052" stroke-width="1"/>
  <path d="M 130 200 Q 130 168 165 163 Q 200 158 235 163 Q 270 168 270 200 L 262 215 Q 200 218 138 215 Z" fill="#f5deb3"/>
  <!-- butter spread on toast -->
  <ellipse cx="200" cy="185" rx="50" ry="25" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
  <!-- butter container -->
  <rect x="60" y="130" width="80" height="60" rx="8" fill="#f5f5f4" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="65" y="135" width="70" height="50" rx="6" fill="#fafaf9"/>
  <rect x="70" y="145" width="60" height="30" rx="3" fill="#fef9c3"/>
  <!-- coconut decoration -->
  <circle cx="320" cy="160" r="25" fill="#92400e" opacity="0.6"/>
  <circle cx="320" cy="160" r="20" fill="#fefce8"/>
  <circle cx="312" cy="155" r="2" fill="#78350f"/>
  <circle cx="322" cy="153" r="2" fill="#78350f"/>
  <!-- cashews -->
  <ellipse cx="330" cy="220" rx="8" ry="5" fill="#f59e0b" opacity="0.6" transform="rotate(20 330 220)"/>
  <ellipse cx="345" cy="215" rx="7" ry="4.5" fill="#d97706" opacity="0.5" transform="rotate(-15 345 215)"/>
  <!-- label -->
  <text x="200" y="50" text-anchor="middle" font-family="serif" font-size="24" fill="#92400e" font-weight="bold">Veganteca</text>
  <text x="200" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Manteca vegetal · Coco y cajú</text>
</svg>
