<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff1f2"/>
      <stop offset="100%" style="stop-color:#fce4ec"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>
  <!-- table -->
  <ellipse cx="200" cy="260" rx="160" ry="20" fill="#d4a574" opacity="0.15"/>
  <!-- yogurt cup -->
  <path d="M 145 130 L 140 240 Q 140 255 200 255 Q 260 255 260 240 L 255 130 Z" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
  <!-- yogurt content with strawberry layer -->
  <ellipse cx="200" cy="220" rx="50" ry="12" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="200" cy="180" rx="52" ry="30" fill="#fefce8"/>
  <!-- lid band -->
  <rect x="142" y="118" width="116" height="18" rx="3" fill="#fb7185" opacity="0.6"/>
  <!-- strawberries -->
  <g transform="translate(80, 160)">
    <path d="M 10 15 Q 0 5 10 0 Q 20 5 10 15" fill="#ef4444"/>
    <circle cx="7" cy="8" r="0.8" fill="#fde68a"/>
    <circle cx="12" cy="6" r="0.8" fill="#fde68a"/>
    <circle cx="9" cy="12" r="0.8" fill="#fde68a"/>
    <path d="M 8 0 L 10 -3 L 12 0" fill="#22c55e"/>
  </g>
  <g transform="translate(300, 170) scale(1.3)">
    <path d="M 10 15 Q 0 5 10 0 Q 20 5 10 15" fill="#dc2626"/>
    <circle cx="7" cy="8" r="0.8" fill="#fde68a"/>
    <circle cx="12" cy="6" r="0.8" fill="#fde68a"/>
    <circle cx="9" cy="12" r="0.8" fill="#fde68a"/>
    <circle cx="13" cy="10" r="0.8" fill="#fde68a"/>
    <path d="M 7 0 L 10 -4 L 13 0" fill="#16a34a"/>
  </g>
  <g transform="translate(100, 210) scale(0.9)">
    <path d="M 10 15 Q 0 5 10 0 Q 20 5 10 15" fill="#f87171"/>
    <circle cx="8" cy="7" r="0.7" fill="#fde68a"/>
    <circle cx="12" cy="9" r="0.7" fill="#fde68a"/>
    <path d="M 8 0 L 10 -3 L 12 0" fill="#4ade80"/>
  </g>
  <g transform="translate(290, 220) scale(1.1)">
    <path d="M 10 15 Q 0 5 10 0 Q 20 5 10 15" fill="#e11d48"/>
    <circle cx="7" cy="8" r="0.7" fill="#fde68a"/>
    <circle cx="11" cy="6" r="0.7" fill="#fde68a"/>
    <circle cx="10" cy="11" r="0.7" fill="#fde68a"/>
    <path d="M 8 0 L 10 -3 L 12 0" fill="#22c55e"/>
  </g>
  <!-- label -->
  <text x="200" y="45" text-anchor="middle" font-family="serif" font-size="22" fill="#be123c" font-weight="bold">Vegurt Frutilla</text>
  <text x="200" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Yogurt vegetal · Con frutilla</text>
</svg>
